{% extends 'base.html' %}{% block title %}Usuários{% endblock %}{% block content %}<div class="container py-4"><h2>Usuários encontrados [{{ usuarios|length }}]</h2>{% for u in usuarios %}<div class="row"><div class="col-md-3">{{ u.user.username }}</div><div class="col-md-4">{{ u.user.email }}</div><div class="col-md-3">{{ u.aniversario }}</div></div>{% empty %}<p>Nenhum usuário comum cadastrado.</p>{% endfor %}</div>{% endblock %}
